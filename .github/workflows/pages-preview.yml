name: Pages Preview (placeholder)

# Deploys the static placeholder page to GitHub Pages
# before training has run, so the site is always available.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy placeholder page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
